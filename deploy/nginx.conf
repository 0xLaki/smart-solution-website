# Static files of the site inside the container. TLS, the domain and www → apex live in the Caddy in front.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # behind Caddy: «/services/crm» → «/services/crm/» must stay a relative redirect (no http://, no :80)
  absolute_redirect off;
  port_in_redirect off;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /assets/ {
    add_header Cache-Control "public, max-age=604800";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
