# Static files of the site inside the container, and /api/ passed on to the assistant's server (smart-api).
# TLS, the domain and www → apex live in the Caddy in front.

# The assistant's API: at most 60 requests a minute from one visitor (the server has its own finer limits)
limit_req_zone $binary_remote_addr zone=smart_api:10m rate=60r/m;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # behind Caddy: «/services/crm» → «/services/crm/» must stay a relative redirect (no http://, no :80)
  absolute_redirect off;
  port_in_redirect off;

  # the visitor's address comes from Caddy in X-Forwarded-For (Caddy and Docker's network are trusted)
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /assets/ {
    add_header Cache-Control "public, max-age=604800";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri =404;
  }

  # Assistant «Смарт». The name is looked up at request time (Docker's DNS), so the site starts and keeps
  # serving pages even while smart-api is down or being recreated; the chat then falls back to the site's texts.
  location /api/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $smart_api http://smart-api:8080;
    proxy_pass $smart_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # GigaChat may take a while when several visitors talk at once
    proxy_read_timeout 90s;
    client_max_body_size 32k;
    limit_req zone=smart_api burst=30 nodelay;
    limit_req_status 429;
    # no add_header here: the server-level headers apply, and smart-api sends Cache-Control: no-store itself
  }

  # The team's admin: one page (admin/index.html) that talks to /api/smart/admin/*. Never cached, never indexed,
  # never framed. An add_header here drops the server-level ones, so they are repeated.
  location = /admin {
    return 301 /admin/;
  }
  location /admin/ {
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files /admin/index.html =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
